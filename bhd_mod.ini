; Options du mod bhd_mod 1.1.0 (dinput8.dll) - Resident Evil HD Remaster
; Les changements sont pris en compte au prochain lancement du jeu.

[Cursor]
; 1 = cacher le curseur de la souris dans le jeu, 0 = laisser le curseur visible
HideCursor=1

[Cutscenes]
; 1 = en "rendu original" (4/3), les cinématiques avec bandes noires sont agrandies
;     pour remplir l'écran en conservant leur ratio d'image. 0 = comportement d'origine
FullscreenCutscenes=1
; 1 = le contenu de la bande noire du bas (sous-titres) est conservé en bas de l'image
KeepSubtitles=1
; 1 = en "rendu original", les animations de porte s'affichent sur toute la largeur de l'écran
WideDoors=1

[Display]
; Résolutions ajoutées au menu des options (jusqu'à 5, séparées par des virgules).
;   auto = ajoute la résolution native de l'écran si le jeu ne la propose pas (2560x1440, 3840x2160...)
;   Exemple : Resolutions=auto,3840x2160   -   Vide = liste d'origine du jeu.
; Elles remplacent 2560x1600, 1680x1050, 1360x768, 1152x864 et 1024x768.
; N'indiquez que des résolutions acceptées par votre écran ou votre pilote.
Resolutions=auto
; Qualité d'image de la scène en "rendu original" (4/3) :
;   auto = super-sampling adapté à la résolution (x2 en 1080p/1440p, x3 en 4K) + réduction de qualité
;   1 = taille d'origine, mais réduction de qualité au lieu du bilinéaire du jeu
;   2, 3, 4 = facteur fixe   -   0 = désactivé (rendu d'origine du jeu)
; Choisissez la résolution native de votre écran dans le jeu (pas de DSR/VSR, inutile ici).
SceneScale=auto

[Startup]
; 1 = supprime l'écran d'avertissement de sauvegarde automatique au lancement
;     (on arrive directement au menu principal)
SkipSaveNotice=1

[Debug]
; 1 = écrit un journal bhd_mod.log à côté de bhd.exe
Log=0
